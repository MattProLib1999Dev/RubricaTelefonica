<div [ngClass]="{'row align-items-baseline':inlineLabel}">
    @if(label.length>0){
    <label for="{{uid}}" class="sh-form-label form-label" [ngClass]="[inlineLabelClass]">{{label}}</label>
    }
    <div class="input-group" [ngClass]="{'col':inlineLabel}">
        <ng-content [slot]="start"></ng-content>
        <input [attr.id]="uid" type="{{type}}" class="{{sizeClass}}" [disabled]="isDisabled()" [readonly]="readonly"
            autocomplete="off" aria-autocomplete="none" placeholder="{{placeholder}}"
            [ngClass]="{'is-valid':isValid && isDirty,'is-invalid':!isValid && isDirty,'form-control-plaintext':readonlyPlain,'form-control':!readonlyPlain}"
            [attr.list]="datalist.length==0?null:'datalist_'+uid" [(ngModel)]="value" (keyup)="keyup($event)"
            (keydown.enter)="enter()"
            >
        @if(datalist.length>0){
        <datalist [attr.id]="'datalist_'+uid">
            @for(d of datalist;track d){
            <option [value]="d"></option>
            }
        </datalist>
        }
        <ng-content [slot]="end"></ng-content>

    </div>
    @if(isDirty){
    <sh-validation-message [errors]="errors" [showValidators]="showValidators"
        [validatorToolTip]="validatorToolTip"></sh-validation-message>
    }
</div>
