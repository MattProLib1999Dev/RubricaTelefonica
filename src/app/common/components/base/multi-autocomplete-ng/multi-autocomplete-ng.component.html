
@if(label.length>0){
    <label for="{{uid}}" class="sh-form-label form-label" [ngClass]="[inlineLabelClass]">{{label}}</label>
}

<div class="position-relative sh-input-group">
    <div
      class="form-control multi-input-wrapper d-flex flex-wrap gap-1 align-items-center"
      [ngClass]="{'col':inlineLabel, 'is-loading': loading, 'loaded': (!loading && !!text.length),
        'is-valid':isValid && isDirty,'is-invalid':!isValid && isDirty, 'multi-input-wrapper-focused': elemFocused, 'disabled' : isDisabled()}"
      (click)="inputRefAutocomplete.focus()">
    
        @for (item of selected(); track $index) {
            <span class="badge rounded-pill bg-primary d-flex align-items-center">
                {{item[textfield]}} 
                @if(!isDisabled()) {
                    <button [id]="'btnclose_' + uid + '_' + $index" (click)="remove(item)" type="button" class="btn-close btn-close-white btn-sm ms-1" aria-label="Close"></button>
                }
            </span>
        }
        <input
            #inputRefAutocomplete
            type="text"
            class="multi-input border-0 flex-grow-1"
            style="min-width: 120px; outline: none;"
            [attr.placeholder]="'CERCA_PLACEHOLDER' | translateNg"
            [ngModel]="text"
            [disabled]="isDisabled()"
            (ngModelChange)="change($event)"/>

        @if(loading){
            <div class="spinner-border text-primary spinner-border-sm rounded-circle" role="status">
                <span class="visually-hidden">...Loading</span>
            </div>
        } @else if (!!data.length) {
            <button (click)="resetData()" type="button" class="btn-close" style="opacity: 1;" aria-label="Close"></button>
        }
    </div>

    @if(!!data.length && dropdownOpen) {
        <ul class="dropdown-menu multi-dropdown-menu w-100 mt-1 show" style="max-height: 150px; overflow-y: auto;">
            @for (item of data; track $index) {
            <li class="dropdown-item w-100">
                <span class="d-flex overflow-x-hidden">
                    <sh-checkbox [(ngModel)]="item.checked" (ngModelChange)='select(item)' [label]="item[textfield]" [fullLength]="true"></sh-checkbox>
                </span>
            </li>
            }
        </ul>
    }
</div>

@if(isDirty){
    <sh-validation-message [errors]="errors" [showValidators]="showValidators"
        [validatorToolTip]="validatorToolTip"></sh-validation-message>
}
